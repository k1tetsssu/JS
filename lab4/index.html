<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Финансавый Трекер</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Учет личных финансов</h1>

    <div class="container">
        <h2>Добавить транзакцию</h2>
        <form id="transaction-form">
            <div class="form-group">
                <label for="amount">Сумма:</label>
                <input type="number" id="amount" step="0.01" required>
            </div>
            <div class="form-group">
                <label for="category">Категория:</label>
                <select id="category" required>
                    <option value="">Выберите категорию</option>
                    <option value="Доход">Доход</option>
                    <option value="Продукты">Продукты</option>
                    <option value="Транспорт">Транспорт</option>
                    <option value="Развлечения">Развлечения</option>
                    <option value="Здоровье">Здоровье</option>
                    <option value="Прочее">Прочее</option>
                </select>
            </div>
            <div class="form-group">
                <label for="description">Описание:</label>
                <input type="text" id="description" required>
            </div>
            <button type="submit">Добавить</button>
        </form>

        <h2>Транзакции</h2>
        <div class="total-container">
            Общая сумма: <span id="total-amount">0.00</span>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Дата и Время</th>
                    <th>Категория транзакции</th>
                    <th>Краткое описание транзакции</th>
                    <th>Действие</th>
                </tr>
            </thead>
            <tbody id="transactions-table-body">
                </tbody>
        </table>

        <div id="transaction-details" class="transaction-details">
            <h3>Подробности транзакции:</h3>
            <p id="details-content"></p>
        </div>
    </div>

    <script src="src/index.js" type="module"></script>
</body>




</html>
